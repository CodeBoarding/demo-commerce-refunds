name: CodeBoarding baseline
on:
  push:
    branches: [main]
    paths-ignore: ['.codeboarding/**']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: codeboarding-baseline
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: CodeBoarding/CodeBoarding-action@v1.16.2
        with:
          mode: sync
          llm: hosted
          depth_cap: '2'
          codeboarding_analysis_location: in_place
